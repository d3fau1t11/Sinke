// Shared release rules; each native app supplies its own senikRole and senikAppName.
def rolePrefix = "SENIK_${project.ext.senikRole.toUpperCase()}_"
def signingValue = { suffix -> System.getenv(rolePrefix + suffix) }
def hasSigning = ['KEYSTORE_PATH', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
    .every { signingValue(it) }
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (releaseRequested && (!hasSigning || !System.getenv('SENIK_VERSION_NAME'))) {
    throw new GradleException('Use the app android:release command with a Git version tag and app-specific signing variables.')
}

android {
    defaultConfig {
        versionCode = (System.getenv('SENIK_VERSION_CODE') ?: '10000').toInteger()
        versionName = System.getenv('SENIK_VERSION_NAME') ?: '1.0.0'
    }
    flavorDimensions += 'environment'
    productFlavors {
        dev {
            dimension 'environment'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', "${project.ext.senikAppName} Dev"
            resValue 'string', 'title_activity_main', "${project.ext.senikAppName} Dev"
        }
        staging {
            dimension 'environment'
            applicationIdSuffix '.staging'
            versionNameSuffix '-staging'
            resValue 'string', 'app_name', "${project.ext.senikAppName} Staging"
            resValue 'string', 'title_activity_main', "${project.ext.senikAppName} Staging"
        }
        prod {
            dimension 'environment'
            resValue 'string', 'app_name', project.ext.senikAppName
            resValue 'string', 'title_activity_main', project.ext.senikAppName
        }
    }
    signingConfigs {
        appRelease {
            if (hasSigning) {
                storeFile file(signingValue('KEYSTORE_PATH'))
                storePassword signingValue('KEYSTORE_PASSWORD')
                keyAlias signingValue('KEY_ALIAS')
                keyPassword signingValue('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.appRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
