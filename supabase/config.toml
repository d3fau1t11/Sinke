project_id = "senik"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
test_otp = "123456"

[auth.external.apple]
enabled = false

[functions]
verify_jwt = true

[functions.create-order]
verify_jwt = true

[functions.validate-promo]
verify_jwt = true

[functions.assign-rider]
verify_jwt = true

[functions.update-order-status]
verify_jwt = true

[functions.payment-initiate]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.send-notification]
verify_jwt = true

[analytics]
enabled = false